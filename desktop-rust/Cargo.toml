[package]
name = "eduone"
version = "1.0.0"
edition = "2021"
description = "EduOne Secure Player — High-Security Native Rust Edition"

[dependencies]
wry = "0.47"
tao = "0.30"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader"] }
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"       # Optimize for minimum binary size
lto = true            # Full Link-Time Optimization
codegen-units = 1     # Maximize optimizations across the whole binary
panic = "abort"       # Remove stack-unwind tables (smaller & harder to reverse)
strip = true          # Strip all debug symbols (impossible for dnSpy/ILSpy to read)
